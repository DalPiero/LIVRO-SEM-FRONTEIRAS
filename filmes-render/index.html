<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tradutor Universal Dal Piero · Teste de filmes</title><style>
body{margin:0;background:#0b1016;color:#f3f1ea;font:1rem system-ui}section{max-width:900px;margin:24px auto;border-radius:12px}label{display:block;margin-top:8px}input:not([type=checkbox]){display:block;width:min(100%,620px);box-sizing:border-box;padding:10px;margin:4px 0 10px}button{background:#d5b56d;border:0;padding:12px;border-radius:8px;font:inherit;cursor:pointer}a{color:#e2c681}footer{padding:16px;text-align:center}
</style><body><section id="filme-url" style="background:#111820;border-bottom:1px solid #283542;padding:20px max(16px, calc((100% - 1464px)/2))">
  <h2 style="margin:0 0 8px;color:#d5b56d">Traduzir filme por URL</h2>
  <form id="filme-form">
    <label for="filme-link">URL do filme · até 240 minutos</label>
    <input id="filme-link" type="url" placeholder="https://…" required>
    <label for="filme-idioma">Idioma de destino</label>
    <input id="filme-idioma" value="Português do Brasil" required maxlength="80">
    <label style="display:block;margin:8px 0"><input style="width:auto;min-height:0" type="checkbox" id="filme-voz" checked> Gerar áudio traduzido com voz sintética</label>
    <button class="primary" type="submit">Traduzir filme</button>
  </form>
  <p id="filme-status" role="status" aria-live="polite"></p>
  <div id="filme-resultados"></div>
</section>
<script>
(() => {
  const e = id => document.getElementById('filme-' + id);
  const form = e('form'), status = e('status'), outputs = e('resultados');
  const button = form.querySelector('button');
  const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
  async function request(path, options) {
    const response = await fetch(path, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Falha de processamento');
    return data;
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    outputs.replaceChildren();
    button.disabled = true;
    status.textContent = 'Recebendo URL…';
    try {
      const job = await request('/filmes', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({url:e('link').value, language:e('idioma').value, voice:e('voz').checked})
      });
      while (true) {
        const current = await request('/filmes/' + job.id);
        status.textContent = current.status;
        if (current.error) throw new Error(current.error);
        if (current.files) {
          for (const [name, label] of Object.entries(current.files)) {
            const link = document.createElement('a');
            link.href = '/filmes/' + job.id + '/' + name;
            link.textContent = label;
            link.style.display = 'block';
            outputs.append(link);
          }
          break;
        }
        await sleep(2500);
      }
    } catch (error) {
      status.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
})();
</script><footer><a href="https://tradutor-dal-piero-filmes-teste-fadal-9821.vercel.app/">Abrir o Tradutor e a amostra de teste</a></footer></body></html>
